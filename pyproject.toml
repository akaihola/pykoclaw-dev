[project]
name = "pykoclaw-workspace"
version = "0.1.0"
description = "Pykoclaw workspace root"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["pykoclaw", "pykoclaw-chat", "pykoclaw-whatsapp", "pykoclaw-messaging", "pykoclaw-acp", "pykoclaw-matrix", "pykoclaw-slack", "pykoclaw-vision", "pykoclaw-pykofinder", "pykoclaw-mcp"]

[dependency-groups]
dev = [
    "canonicaljson>=2.0.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "e2e: end-to-end ACP subprocess tests that require external credentials",
]
